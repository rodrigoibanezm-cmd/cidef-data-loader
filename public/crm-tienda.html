<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CIDEF · Cómo vamos</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#101b35;background:#f4f7fb;--border:#dbe3ee;--muted:#64718a;--navy:#15233e;--green:#1f9d61;--yellow:#e9a600;--red:#df3e45;--blue:#1769d1}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f8fbff 0,#eef3f8 100%);min-height:100vh}.shell{max-width:1440px;margin:auto;padding:24px 32px 40px}.top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:22px}.top h1{margin:0;font-size:38px;line-height:1.05;letter-spacing:-1.4px}.subtitle,.cuts{color:var(--muted);font-size:15px;margin-top:7px}.controls{display:grid;justify-items:end;gap:12px}.switch{display:flex;border:1px solid #cbd6e4;background:#f5f7fb;border-radius:12px;padding:3px}.switch button{border:0;background:transparent;color:#536079;padding:11px 32px;border-radius:9px;font:inherit;cursor:pointer}.switch button.active{background:var(--navy);color:white;font-weight:700;box-shadow:0 2px 8px #15233e33}.store-select{display:none;min-width:260px;border:1px solid #cbd6e4;border-radius:10px;background:white;padding:10px;font:inherit}.store-select.show{display:block}
.hero,.domain,.finding,.action,.empty{background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:14px}.hero{display:grid;grid-template-columns:8px 1fr auto;overflow:hidden;min-height:144px}.hero-line{background:var(--green)}.hero-line.warning{background:var(--yellow)}.hero-line.critical{background:var(--red)}.hero-main{padding:24px 30px}.eyebrow{font-size:13px;letter-spacing:.7px;color:#64718a;font-weight:650}.hero h2{font-size:30px;line-height:1.2;margin:12px 0 5px;letter-spacing:-.6px}.hero p{margin:0;color:var(--muted);font-size:17px}.hero-stats{display:flex;align-items:center}.hero-stat{padding:8px 30px;border-left:1px solid var(--border);min-width:150px}.hero-stat b{display:block;font-size:36px}.hero-stat span{color:var(--muted)}
.domains{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:16px}.domain{padding:18px 20px;min-height:250px;display:flex;flex-direction:column}.domain-head{display:flex;justify-content:space-between;align-items:center;color:#34435e;font-size:14px;font-weight:750}.domain-value{font-size:34px;font-weight:800;margin:14px 0 7px;letter-spacing:-.8px}.domain-value small{font-size:20px}.pill{align-self:flex-start;border-radius:999px;padding:5px 14px;font-size:12px;font-weight:800;background:#e9eef5;color:#5b6980}.pill.positive{background:#c9f0da;color:#155d3d}.pill.warning{background:#ffe3a0;color:#694900}.pill.critical{background:#ffd5d7;color:#8d2027}.pill.neutral{background:#e8edf3;color:#5e6a7d}.change{margin:12px 0 4px;color:#55647d}.detail{color:var(--muted);font-size:13px}.spark-wrap{margin-top:auto;padding-top:12px}.trend-note{font-size:13px;font-weight:750;margin-bottom:7px}.trend-note.positive{color:var(--green)}.trend-note.warning{color:#9a6d00}.trend-note.critical{color:var(--red)}.trend-note.neutral{color:var(--muted)}.spark{height:48px}.spark svg{width:100%;height:48px;overflow:visible}.spark-labels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:4px}.spark-label{text-align:center;color:#6b7890;font-size:10px}.spark-label b{display:block;color:#25344e;font-size:12px}.cutoff{font-size:12px;color:#6b7890;text-align:right;margin-top:7px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:25px 0 11px}.section-head h3{margin:0;font-size:25px;letter-spacing:-.4px}.section-head button{border:0;background:transparent;color:#304667;cursor:pointer;font:inherit}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.finding{padding:20px;display:grid;grid-template-columns:42px 1fr;gap:14px;min-height:135px}.finding.critical{background:#fff4f4;border-color:#f1c5c7}.finding.warning{background:#fffaf0;border-color:#efdbab}.finding.positive{background:#f0fbf5;border-color:#bfe3ce}.icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;background:#7a8798;font-weight:900}.critical .icon{background:var(--red)}.warning .icon{background:var(--yellow)}.positive .icon{background:var(--green)}.finding h4,.action h4{margin:1px 0 7px;font-size:17px}.finding p,.action p{margin:0;color:#596981;font-size:14px}.tags{display:flex;gap:7px;margin-top:15px;flex-wrap:wrap}.tag{font-size:10px;background:#ffffffaa;border-radius:7px;padding:5px 9px;color:#58677e;font-weight:750}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:14px}.action{padding:18px 22px;display:grid;grid-template-columns:1fr auto;gap:15px}.priority{font-size:11px;border-radius:999px;padding:5px 10px;background:#ffe0e2;color:#a72831;font-weight:800;display:inline-block;margin-bottom:8px}.priority.medium{background:#ffebba;color:#7b5900}.impact{text-align:right;color:#66758d;font-size:12px}.impact b{display:block;font-size:21px;color:#14213b}.evidence{margin-top:14px;color:#6a7890;font-size:12px}.empty{padding:26px;color:var(--muted);text-align:center}.store-link{margin-top:16px;width:100%;border:1px solid var(--border);border-radius:13px;background:white;padding:16px;color:#233858;font:inherit;cursor:pointer}.hidden{display:none!important}.error{position:fixed;right:20px;bottom:20px;background:#15233e;color:#fff;padding:13px 16px;border-radius:10px}.loading{opacity:.45;pointer-events:none}
@media(max-width:1100px){.domains{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr 1fr}}@media(max-width:760px){.shell{padding:18px}.top{display:grid}.controls{justify-items:start}.top h1{font-size:31px}.hero{grid-template-columns:7px 1fr}.hero-stats{grid-column:2;justify-content:flex-start;padding:0 20px 20px}.domains{grid-template-columns:1fr 1fr}.grid,.actions{grid-template-columns:1fr}}@media(max-width:480px){.domains{grid-template-columns:1fr}.switch button{padding:10px 18px}.hero-stats{display:grid;grid-template-columns:1fr 1fr}.hero-stat{padding:8px 14px}.action{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="shell loading" id="app">
  <header class="top">
    <div><h1 id="title">CIDEF · Cómo vamos</h1><div class="subtitle" id="subtitle">Cargando snapshot…</div></div>
    <div class="controls">
      <div class="switch"><button id="companyBtn" class="active">Vista general</button><button id="storeBtn">Por tienda</button></div>
      <select id="storeSelect" class="store-select"></select>
      <div class="cuts" id="cuts"></div>
    </div>
  </header>
  <section class="hero">
    <div class="hero-line" id="heroLine"></div>
    <div class="hero-main"><div class="eyebrow">VEREDICTO EJECUTIVO</div><h2 id="verdictTitle">—</h2><p id="verdictDescription">—</p></div>
    <div class="hero-stats"><div class="hero-stat"><b id="primaryValue">—</b><span id="primaryLabel">VIN MTD</span></div><div class="hero-stat"><b id="alertCount">0</b><span>alertas</span></div></div>
  </section>
  <section class="domains" id="domains"></section>
  <div class="section-head"><h3>Qué explica el resultado</h3><button data-toggle="explanations">Ocultar</button></div>
  <section class="grid" id="explanations"></section>
  <div class="section-head"><h3>Dónde actuar</h3><button data-toggle="actions">Ocultar</button></div>
  <section class="actions" id="actions"></section>
  <button class="store-link" id="allStores">Ver todas las tiendas →</button>
</main>
<script>
var API='/api/dashboard';var state={data:null,mode:'company',storeId:null};var el=function(id){return document.getElementById(id)};
function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function dateLabel(value){if(!value)return 'sin corte';var p=String(value).slice(0,10).split('-');return p[2]+'-'+p[1]}
function monthLabel(value){if(!value)return '';var p=String(value).slice(0,7).split('-');return new Intl.DateTimeFormat('es-CL',{month:'long',year:'numeric'}).format(new Date(Date.UTC(Number(p[0]),Number(p[1])-1,1)))}
function periodLabel(value){if(!value)return '';var p=String(value).split('-');return new Intl.DateTimeFormat('es-CL',{month:'short'}).format(new Date(Date.UTC(Number(p[0]),Number(p[1])-1,1))).replace('.','')}
function spark(values,tone,periods,description){if(!Array.isArray(values)||values.length<2)return '<div class="spark-wrap"><div class="spark"></div></div>';var nums=values.map(Number),min=Math.min.apply(null,nums),max=Math.max.apply(null,nums),span=max-min||1;var pts=nums.map(function(v,i){return (i/(nums.length-1)*100)+','+(40-(v-min)/span*30)}).join(' ');var colors={positive:'#249b61',warning:'#dfa100',critical:'#d93c43',neutral:'#8d99aa'};var color=colors[tone]||colors.neutral;var note=description?'<div class="trend-note '+esc(tone||'neutral')+'">'+esc(description)+'</div>':'';var labels=Array.isArray(periods)&&periods.length===nums.length?'<div class="spark-labels">'+nums.map(function(v,i){return '<div class="spark-label"><b>'+esc(v)+'</b>'+esc(periodLabel(periods[i]))+'</div>'}).join('')+'</div>':'';return '<div class="spark-wrap">'+note+'<div class="spark"><svg viewBox="0 0 100 48" preserveAspectRatio="none"><polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2"/>'+nums.map(function(v,i){return '<circle cx="'+(i/(nums.length-1)*100)+'" cy="'+(40-(v-min)/span*30)+'" r="2.3" fill="'+color+'"/>'}).join('')+'</svg></div>'+labels+'</div>'}
function domainCard(key,c){var value=c&&c.value!=null?c.value:'—';return '<article class="domain"><div class="domain-head"><span>'+esc(c.title)+'</span><span>›</span></div><div class="domain-value">'+esc(value)+' <small>'+esc(c.unit||'')+'</small></div><span class="pill '+esc(c.tone||'neutral')+'">'+esc(c.status||'SIN EVIDENCIA')+'</span><div class="change">'+esc(c.change||'')+'</div><div class="detail">'+esc(c.detail||'')+'</div>'+spark(c.trend,c.trend_tone||c.tone,c.trend_periods,c.trend_description)+'<div class="cutoff">'+esc(dateLabel(c.cutoff))+'</div></article>'}
function signalCard(s){var symbol=s.tone==='POSITIVE'?'✓':'!';return '<article class="finding '+String(s.tone||'NEUTRAL').toLowerCase()+'"><div class="icon">'+symbol+'</div><div><h4>'+esc(s.title)+'</h4><p>'+esc(s.summary)+'</p><div class="tags">'+(s.domains||[]).map(function(d){return '<span class="tag">'+esc(d)+'</span>'}).join('')+'</div></div></article>'}
function actionCard(s){var medium=s.priority>1?' medium':'';var impact=s.impact_value==null?'':('<div class="impact">Magnitud<b>'+esc(s.impact_value)+' '+esc(s.impact_unit||'')+'</b></div>');return '<article class="action"><div><span class="priority'+medium+'">'+(s.priority===1?'PRIORIDAD ALTA':'PRIORIDAD MEDIA')+'</span><h4>'+esc(s.title)+'</h4><p>'+esc(s.summary)+'</p><div class="evidence">Evidencia al '+esc(dateLabel(s.evidence_as_of))+' · '+esc((s.domains||[]).join(' · '))+'</div></div>'+impact+'</article>'}
function currentPayload(){if(state.mode==='company')return state.data.company;var row=(state.data.stores||[]).find(function(x){return String(x.sucursal_id)===String(state.storeId)});return row?row.payload:state.data.company}
function currentSignals(){var all=state.data.signals||[];if(state.mode==='company')return all.filter(function(s){return s.scope_type==='COMPANY'});return all.filter(function(s){return s.scope_type==='STORE'&&String(s.scope_id)===String(state.storeId)})}
function render(){
 var p=currentPayload(),v=p.verdict||{},cards=p.cards||{},signals=currentSignals();
 el('title').textContent=state.mode==='company'?'CIDEF · Cómo vamos':(p.scope&&p.scope.name?p.scope.name+' · Cómo vamos':'Tienda · Cómo vamos');
 el('subtitle').textContent=monthLabel(state.data.period_month)+' · Mes comercial desde el 02';
 el('cuts').textContent=Object.entries(p.source_cutoffs||{}).map(function(x){return x[0].toUpperCase()+' '+dateLabel(x[1])}).join(' · ');
 el('heroLine').className='hero-line '+(v.tone||'');
 el('verdictTitle').textContent=v.title||'Sin veredicto';
 el('verdictDescription').textContent=v.description||'';
 el('primaryValue').textContent=v.primary_value!=null?v.primary_value:(cards.sales&&cards.sales.value!=null?cards.sales.value:'—');
 el('primaryLabel').textContent=v.primary_label||'VIN MTD';
 el('alertCount').textContent=signals.filter(function(s){return s.signal_type==='ACTION'}).length;
 el('domains').innerHTML=['sales','rvm','crm','forum','projections'].map(function(k){return domainCard(k,cards[k]||{title:k.toUpperCase()})}).join('');
 var explanations=signals.filter(function(s){return s.signal_type==='EXPLANATION'}).slice(0,3);
 var actions=signals.filter(function(s){return s.signal_type==='ACTION'}).slice(0,2);
 el('explanations').innerHTML=explanations.length?explanations.map(signalCard).join(''):'<div class="empty">Sin hallazgos publicables para este corte.</div>';
 el('actions').innerHTML=actions.length?actions.map(actionCard).join(''):'<div class="empty">Sin acciones priorizadas para este corte.</div>';
 el('storeSelect').classList.toggle('show',state.mode==='store');
 el('allStores').classList.toggle('hidden',state.mode==='store');
 el('companyBtn').classList.toggle('active',state.mode==='company');el('storeBtn').classList.toggle('active',state.mode==='store');
}
async function load(storeId){var url=API+(storeId?'?sucursal_id='+encodeURIComponent(storeId):'');var r=await fetch(url);var j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'No fue posible cargar el snapshot');return j}
async function selectStore(id){state.storeId=id;state.data=await load(id);render()}
el('companyBtn').onclick=async function(){state.mode='company';state.data=await load();render()};
el('storeBtn').onclick=async function(){state.mode='store';if(!state.storeId)state.storeId=el('storeSelect').value;await selectStore(state.storeId)};
el('storeSelect').onchange=function(){selectStore(this.value).catch(showError)};
el('allStores').onclick=function(){el('storeBtn').click()};
document.querySelectorAll('[data-toggle]').forEach(function(button){button.onclick=function(){var target=el(this.dataset.toggle);var hidden=target.classList.toggle('hidden');this.textContent=hidden?'Mostrar':'Ocultar'}});
function showError(error){var box=document.createElement('div');box.className='error';box.textContent=error.message;document.body.appendChild(box);setTimeout(function(){box.remove()},5000)}
(async function(){try{state.data=await load();var stores=state.data.stores||[];el('storeSelect').innerHTML=stores.map(function(s){return '<option value="'+esc(s.sucursal_id)+'">'+esc(s.sucursal)+'</option>'}).join('');state.storeId=stores[0]&&stores[0].sucursal_id;render();el('app').classList.remove('loading')}catch(error){el('app').classList.remove('loading');showError(error)}})();
</script>
</body>
</html>
