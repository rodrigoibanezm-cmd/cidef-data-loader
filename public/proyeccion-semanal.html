<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proyección semanal CIDEF</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}.shell{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:22px}.top h1{font-size:25px;margin:0 0 4px}.muted{color:#687386;font-size:13px}.filters{display:flex;gap:10px;flex-wrap:wrap}.field{display:grid;gap:5px}.field label{font-size:12px;font-weight:650;color:#596579}select,input,button{font:inherit}select,input{min-height:40px;border:1px solid #d5dbe5;border-radius:9px;background:#fff;padding:8px 10px;color:#172033}.summary{display:flex;gap:10px;margin:0 0 18px;flex-wrap:wrap}.pill{background:#fff;border:1px solid #e1e5ec;border-radius:10px;padding:9px 12px;font-size:13px}.seller{background:#fff;border:1px solid #e1e5ec;border-radius:14px;margin:11px 0;overflow:hidden}.seller-head{display:flex;justify-content:space-between;align-items:center;padding:15px 17px}.seller-name{font-weight:700}.seller-total{font-size:13px;color:#687386}.lines{border-top:1px solid #edf0f4}.line{display:grid;grid-template-columns:minmax(180px,1.7fr) 145px minmax(220px,1.8fr) 36px;gap:9px;padding:11px 17px;align-items:center;border-bottom:1px solid #f0f2f5}.line:last-child{border-bottom:0}.crm-wrap{display:grid;grid-template-columns:1fr auto;gap:6px}.crm-manual{display:none;margin-top:6px}.crm-manual.show{display:block}.btn{border:0;border-radius:9px;cursor:pointer;min-height:38px;padding:8px 12px}.primary{background:#172033;color:#fff}.secondary{background:#eef1f5;color:#273246}.add{margin:0 17px 14px}.icon{background:transparent;color:#8a94a5;font-size:19px;padding:0}.empty{padding:12px 17px;color:#7b8494;font-size:13px}.status{position:fixed;right:18px;bottom:18px;background:#172033;color:white;border-radius:10px;padding:11px 14px;font-size:13px;display:none;max-width:360px}.status.show{display:block}.warning{color:#a25a00;font-size:12px;margin-top:5px}.history{margin-top:24px}.history h2{font-size:16px}.saved{display:grid;grid-template-columns:1.6fr 1.2fr 110px 1fr 72px;gap:8px;padding:9px 0;border-bottom:1px solid #e4e8ee;font-size:13px;align-items:center}.saved-actions{display:flex;gap:4px;justify-content:flex-end}.edit-form{grid-column:1/-1;display:grid;grid-template-columns:minmax(180px,1.5fr) minmax(220px,1.8fr) auto auto;gap:8px;padding:10px 0 4px}.edit-form .crm-edit-wrap{display:grid;grid-template-columns:1fr auto;gap:6px}.edit-form .crm-manual{grid-column:1/-1}.small-btn{min-height:34px;padding:6px 10px;font-size:12px}@media(max-width:760px){.shell{padding:16px}.top{display:grid;align-items:stretch}.filters{display:grid;grid-template-columns:1fr 1fr}.line{grid-template-columns:1fr}.line .date,.line .crm-wrap{grid-column:1/-1}.seller-head{padding:14px}.line{padding:11px 14px}.add{margin-left:14px}.saved{grid-template-columns:1fr 1fr}.saved>*:nth-child(n+3){font-size:12px}.saved-actions{grid-column:2;justify-content:flex-end}.edit-form{grid-template-columns:1fr}.edit-form .crm-edit-wrap{grid-template-columns:1fr auto}.edit-form .primary,.edit-form .secondary{width:100%}}
</style>
</head>
<body><main class="shell">
<div class="top"><div><h1>Proyección semanal</h1><div class="muted">1 proyección = 1 venta = 1 VIN · cierre semanal viernes</div></div><div class="filters"><div class="field"><label>Sucursal</label><select id="branch"><option>Cargando…</option></select></div><div class="field"><label>Semana (lunes)</label><input id="week" type="date"></div></div></div>
<div class="summary"><div class="pill"><b id="totalUnits">0</b> unidades proyectadas</div><div class="pill"><b id="linkedUnits">0</b> vinculadas a CRM</div></div>
<section id="sellers"></section>
<section class="history"><h2>Proyecciones guardadas</h2><div id="saved" class="muted">Selecciona una sucursal.</div></section>
</main><div id="status" class="status"></div>
<script>
const API='/api/weekly-projections';const $=s=>document.querySelector(s);let branches=[],models=[],sellers=[],saved=[];
function localYmd(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function monday(value=new Date()){const x=typeof value==='string'?new Date(value+'T12:00:00'):new Date(value);const day=x.getDay()||7;x.setDate(x.getDate()-day+1);return localYmd(x)}
function normalizeWeek(){const normalized=monday($('#week').value||new Date());if($('#week').value!==normalized)$('#week').value=normalized;return normalized}
function friday(weekStart){const x=new Date(weekStart+'T12:00:00');x.setDate(x.getDate()+4);return localYmd(x)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const e=$('#status');e.textContent=msg;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),3500)}
async function json(url,opt){const r=await fetch(url,opt);const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Error');return j}
async function init(){ $('#week').value=monday(); const [b,m]=await Promise.all([json(API+'/sucursales'),json(API+'/modelos')]);branches=b.sucursales||b.branches||[];models=m.modelos||m.models||[];$('#branch').innerHTML='<option value="">Seleccionar…</option>'+branches.map(x=>`<option value="${x.sucursal_id}">${esc(x.nombre_canonico||x.nombre)}</option>`).join('');$('#branch').onchange=load;$('#week').onchange=()=>{normalizeWeek();load()}; }
async function load(){const bid=$('#branch').value;if(!bid)return;const weekStart=normalizeWeek();try{const [v,p]=await Promise.all([json(`${API}/vendedores?sucursal_id=${bid}`),json(`${API}/projections?sucursal_id=${bid}&week_start=${weekStart}`)]);sellers=v.vendedores||v.sellers||[];saved=p.projections||[];render();}catch(e){toast(e.message)}}
function modelOptions(selected=''){return '<option value="">Modelo…</option>'+models.map(m=>`<option value="${m.modelo_id}" ${String(m.modelo_id)===String(selected)?'selected':''}>${esc(m.marca)} · ${esc(m.modelo)}</option>`).join('')}
function render(){const host=$('#sellers');host.innerHTML=sellers.map(s=>`<article class="seller" data-person="${s.persona_id}"><div class="seller-head"><div class="seller-name">${esc(s.nombre_canonico||s.vendedor||s.nombre)}</div><div class="seller-total"><span class="draft-total">0</span> nuevas</div></div><div class="lines"><div class="empty">Sin nuevas proyecciones.</div></div><button class="btn secondary add" onclick="addLine('${s.persona_id}',this)">+ Agregar proyección</button></article>`).join('');renderSaved();updateSummary()}
function addLine(pid,btn){const box=btn.parentElement.querySelector('.lines');box.querySelector('.empty')?.remove();const div=document.createElement('div');div.className='line';div.innerHTML=`<select class="model">${modelOptions()}</select><input class="date" type="date" value="${friday(normalizeWeek())}" readonly><div><div class="crm-wrap"><select class="crm"><option value="NONE">Sin oportunidad CRM</option><option value="MANUAL">Ingresar ID manual…</option></select><button class="btn secondary find" type="button">Buscar</button></div><input class="crm-manual" placeholder="ID oportunidad manual"></div><button class="btn icon" title="Quitar">×</button>`;box.appendChild(div);div.querySelector('.icon').onclick=()=>{div.remove();updateDraft(pid)};div.querySelector('.find').onclick=()=>findCrm(div,pid);div.querySelector('.crm').onchange=()=>crmChange(div);div.querySelector('.model').onchange=()=>{div.querySelector('.crm').innerHTML='<option value="NONE">Sin oportunidad CRM</option><option value="MANUAL">Ingresar ID manual…</option>';crmChange(div)};updateDraft(pid)}
function crmChange(line){line.querySelector('.crm-manual').classList.toggle('show',line.querySelector('.crm').value==='MANUAL')}
async function findCrm(line,pid){const mid=line.querySelector('.model').value;if(!mid)return toast('Selecciona primero un modelo.');const sel=line.querySelector('.crm');try{const j=await json(`${API}/oportunidades?sucursal_id=${$('#branch').value}&persona_id=${pid}&modelo_id=${mid}`);sel.innerHTML='<option value="NONE">Sin oportunidad CRM</option>'+j.opportunities.map(o=>`<option value="${esc(o.crm_opportunity_id)}">#${esc(o.crm_opportunity_id)} · ${esc(o.cliente||'Sin nombre')} · ${esc(o.estado)}</option>`).join('')+'<option value="MANUAL">Ingresar ID manual…</option>';if(!j.opportunities.length)toast('No hay oportunidades abiertas compatibles.');}catch(e){toast(e.message)}}
async function saveLine(line,pid){const model=line.querySelector('.model').value,date=line.querySelector('.date').value,choice=line.querySelector('.crm').value;if(!model||!date)return toast('Selecciona un modelo.');let method='NONE',crm=null;if(choice==='MANUAL'){method='MANUAL';crm=line.querySelector('.crm-manual').value.trim();if(!crm)return toast('Ingresa el ID CRM.')}else if(choice!=='NONE'){method='SUGGESTED';crm=choice}try{const j=await json(API+'/projections',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({week_start:normalizeWeek(),sucursal_id:$('#branch').value,persona_id:pid,modelo_id:model,projected_units:1,expected_close_date:date,crm_opportunity_id:crm,crm_link_method:method})});if(j.warnings?.length)toast('Guardado: '+j.warnings.join(' '));else toast('Proyección guardada.');await load()}catch(e){toast(e.message)}}
function updateDraft(pid){const card=document.querySelector(`[data-person="${pid}"]`);const n=card.querySelectorAll('.line').length;card.querySelector('.draft-total').textContent=n;[...card.querySelectorAll('.line')].forEach(l=>{if(!l.querySelector('.save')){const b=document.createElement('button');b.className='btn primary save';b.textContent='Guardar';b.style.gridColumn='1/-1';b.onclick=()=>saveLine(l,pid);l.appendChild(b)}})}
function renderSaved(){const h=$('#saved');if(!saved.length){h.innerHTML='<div class="muted">No hay proyecciones guardadas para esta semana.</div>';return}h.innerHTML=saved.map(p=>`<div class="saved" id="saved-${p.projection_id}"><b>${esc(p.vendedor)}</b><span>${esc(p.marca)} · ${esc(p.modelo)}</span><span>${esc(p.expected_close_date)}</span><span>${p.crm_opportunity_id?'CRM #'+esc(p.crm_opportunity_id):'Sin CRM'}</span><div class="saved-actions"><button class="btn icon small-btn" title="Editar" onclick="editSaved('${p.projection_id}')">✎</button><button class="btn icon delete small-btn" title="Eliminar" onclick="removeSaved('${p.projection_id}')">×</button></div></div>`).join('')}
function editSaved(id){const p=saved.find(x=>String(x.projection_id)===String(id));const row=document.querySelector(`#saved-${id}`);if(!p||!row)return;row.querySelector('.edit-form')?.remove();const form=document.createElement('div');form.className='edit-form';form.innerHTML=`<select class="edit-model">${modelOptions(p.modelo_id)}</select><div><div class="crm-edit-wrap"><select class="edit-crm"><option value="NONE" ${!p.crm_opportunity_id?'selected':''}>Sin CRM</option><option value="MANUAL" ${p.crm_opportunity_id?'selected':''}>ID CRM manual</option></select><button class="btn secondary small-btn edit-find" type="button">Buscar CRM</button></div><input class="crm-manual edit-crm-manual ${p.crm_opportunity_id?'show':''}" placeholder="ID oportunidad" value="${esc(p.crm_opportunity_id||'')}"></div><button class="btn primary small-btn edit-save" type="button">Guardar cambios</button><button class="btn secondary small-btn edit-cancel" type="button">Cancelar</button>`;row.appendChild(form);form.querySelector('.edit-crm').onchange=()=>form.querySelector('.edit-crm-manual').classList.toggle('show',form.querySelector('.edit-crm').value==='MANUAL');form.querySelector('.edit-model').onchange=()=>{form.querySelector('.edit-crm').innerHTML='<option value="NONE">Sin CRM</option><option value="MANUAL">ID CRM manual</option>';form.querySelector('.edit-crm-manual').value='';form.querySelector('.edit-crm-manual').classList.remove('show')};form.querySelector('.edit-find').onclick=()=>findCrmEdit(form,p);form.querySelector('.edit-save').onclick=()=>saveEdit(form,p);form.querySelector('.edit-cancel').onclick=()=>form.remove()}
async function findCrmEdit(form,p){const mid=form.querySelector('.edit-model').value;if(!mid)return toast('Selecciona primero un modelo.');const sel=form.querySelector('.edit-crm');try{const j=await json(`${API}/oportunidades?sucursal_id=${p.sucursal_id}&persona_id=${p.persona_id}&modelo_id=${mid}`);sel.innerHTML='<option value="NONE">Sin CRM</option>'+j.opportunities.map(o=>`<option value="${esc(o.crm_opportunity_id)}">#${esc(o.crm_opportunity_id)} · ${esc(o.cliente||'Sin nombre')} · ${esc(o.estado)}</option>`).join('')+'<option value="MANUAL">ID CRM manual</option>';form.querySelector('.edit-crm-manual').classList.remove('show');if(!j.opportunities.length)toast('No hay oportunidades abiertas compatibles.');}catch(e){toast(e.message)}}
async function saveEdit(form,p){const modeloId=form.querySelector('.edit-model').value,choice=form.querySelector('.edit-crm').value;if(!modeloId)return toast('Selecciona un modelo.');let method='NONE',crm=null;if(choice==='MANUAL'){method='MANUAL';crm=form.querySelector('.edit-crm-manual').value.trim();if(!crm)return toast('Ingresa el ID CRM.')}else if(choice!=='NONE'){method='SUGGESTED';crm=choice}try{const j=await json(API+'/projections',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({projection_id:p.projection_id,modelo_id:modeloId,projected_units:1,expected_close_date:p.expected_close_date,crm_opportunity_id:crm,crm_link_method:method})});if(j.warnings?.length)toast('Actualizado: '+j.warnings.join(' '));else toast('Proyección actualizada.');await load()}catch(e){toast(e.message)}}
async function removeSaved(id){try{await json(API+'/projections',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({projection_id:id})});toast('Proyección eliminada.');await load()}catch(e){toast(e.message)}}
function updateSummary(){const total=saved.length,linked=saved.filter(p=>p.crm_opportunity_id).length;$('#totalUnits').textContent=total;$('#linkedUnits').textContent=linked}
init().catch(e=>toast(e.message));
</script></body></html>
