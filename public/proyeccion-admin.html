<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin proyecciones CIDEF</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}.shell{max-width:1250px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:18px;align-items:end;flex-wrap:wrap}.top h1{margin:0 0 4px;font-size:26px}.muted{color:#6d7788;font-size:13px}.filters{display:flex;gap:10px;flex-wrap:wrap}.field{display:grid;gap:5px}.field label{font-size:12px;font-weight:650;color:#596579}select,input{min-height:40px;border:1px solid #d5dbe5;border-radius:9px;background:#fff;padding:8px 10px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.card,.panel{background:#fff;border:1px solid #e1e5ec;border-radius:14px}.card{padding:16px}.kpi{font-size:28px;font-weight:750;margin-top:4px}.label{font-size:12px;color:#687386}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{padding:16px}.panel h2{font-size:15px;margin:0 0 12px}.barrow{display:grid;grid-template-columns:minmax(120px,1fr) 2fr 48px;gap:10px;align-items:center;margin:8px 0;font-size:13px}.bar{height:10px;background:#eef1f5;border-radius:999px;overflow:hidden}.fill{height:100%;background:#172033}.table-wrap{overflow:auto;margin-top:14px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #edf0f4;white-space:nowrap}.table th{font-size:12px;color:#697487;background:#fafbfc;position:sticky;top:0}.tag{display:inline-block;padding:3px 7px;border-radius:999px;background:#eef1f5;font-size:11px}.tag.ok{background:#e8f5ee}.tag.no{background:#f8ecec}.section-title{font-size:17px;margin:24px 0 10px}.empty{padding:20px;color:#778294}.status{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:11px 14px;border-radius:10px;display:none;font-size:13px}.status.show{display:block}@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:620px){.shell{padding:15px}.cards{grid-template-columns:1fr 1fr}.filters{display:grid;grid-template-columns:1fr 1fr;width:100%}.barrow{grid-template-columns:1fr 1.4fr 42px}}
</style></head><body><main class="shell"><div class="top"><div><h1>Admin · Proyección semanal</h1><div class="muted">Consolidado ejecutivo y detalle operacional</div></div><div class="filters"><div class="field"><label>Semana</label><input id="week" type="date"></div><div class="field"><label>Sucursal</label><select id="branch"><option value="">Todas</option></select></div></div></div>
<div class="cards"><div class="card"><div class="label">Total proyectado</div><div class="kpi" id="total">0</div></div><div class="card"><div class="label">Con CRM</div><div class="kpi" id="crm">0</div></div><div class="card"><div class="label">Sin CRM</div><div class="kpi" id="nocrm">0</div></div><div class="card"><div class="label">Cobertura CRM</div><div class="kpi" id="coverage">0%</div></div></div>
<div class="grid"><div class="panel"><h2>Por marca</h2><div id="byBrand"></div></div><div class="panel"><h2>Por tienda</h2><div id="byStore"></div></div><div class="panel"><h2>Por modelo</h2><div id="byModel"></div></div><div class="panel"><h2>Por vendedor</h2><div id="bySeller"></div></div></div>
<h2 class="section-title">Detalle de proyecciones</h2><div class="panel table-wrap"><table class="table"><thead><tr><th>Tienda</th><th>Vendedor</th><th>Marca</th><th>Modelo</th><th>Unidades</th><th>Fecha</th><th>CRM</th><th>Método</th></tr></thead><tbody id="tbody"></tbody></table></div></main><div id="status" class="status"></div>
<script>
const API='/api/weekly-projections';const $=s=>document.querySelector(s);let branches=[];function monday(d=new Date()){const x=new Date(d);const day=x.getDay()||7;x.setDate(x.getDate()-day+1);return x.toISOString().slice(0,10)}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(m){const e=$('#status');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),3000)}async function json(u){const r=await fetch(u),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Error');return j}function group(rows,keyFn){const m=new Map;for(const r of rows){const k=keyFn(r)||'Sin dato';m.set(k,(m.get(k)||0)+Number(r.projected_units||0))}return [...m.entries()].sort((a,b)=>b[1]-a[1])}function bars(target,data){const max=Math.max(1,...data.map(x=>x[1]));$(target).innerHTML=data.length?data.slice(0,12).map(([k,v])=>`<div class="barrow"><span>${esc(k)}</span><div class="bar"><div class="fill" style="width:${Math.round(v/max*100)}%"></div></div><b>${v}</b></div>`).join(''):'<div class="empty">Sin datos</div>'}async function init(){ $('#week').value=monday();const b=await json(API+'/sucursales');branches=b.sucursales||[];$('#branch').innerHTML='<option value="">Todas</option>'+branches.map(x=>`<option value="${x.sucursal_id}">${esc(x.nombre_canonico)}</option>`).join('');$('#week').onchange=load;$('#branch').onchange=load;await load()}async function load(){try{const qs=new URLSearchParams({week_start:$('#week').value});if($('#branch').value)qs.set('sucursal_id',$('#branch').value);const j=await json(API+'/admin?'+qs);const rows=j.projections||[],s=j.summary||{};$('#total').textContent=s.total_units||0;$('#crm').textContent=s.crm_units||0;$('#nocrm').textContent=s.no_crm_units||0;$('#coverage').textContent=(s.total_units?Math.round((s.crm_units||0)/s.total_units*100):0)+'%';bars('#byBrand',group(rows,r=>r.marca));bars('#byStore',group(rows,r=>r.sucursal));bars('#byModel',group(rows,r=>`${r.marca} · ${r.modelo}`));bars('#bySeller',group(rows,r=>r.vendedor));$('#tbody').innerHTML=rows.length?rows.map(r=>`<tr><td>${esc(r.sucursal)}</td><td>${esc(r.vendedor)}</td><td>${esc(r.marca)}</td><td>${esc(r.modelo)}</td><td><b>${r.projected_units}</b></td><td>${esc(r.expected_close_date)}</td><td>${r.crm_opportunity_id?`<span class="tag ok">#${esc(r.crm_opportunity_id)}</span>`:'<span class="tag no">Sin CRM</span>'}</td><td>${esc(r.crm_link_method)}</td></tr>`).join(''):'<tr><td colspan="8" class="empty">No hay proyecciones para este filtro.</td></tr>'}catch(e){toast(e.message)}}init().catch(e=>toast(e.message));
</script></body></html>
