name: certify-temporal-pr

on:
  push:
    branches:
      - refactor/temporal-boundary-cleanup

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          ref: refactor/temporal-boundary-cleanup

      - name: Migrate stale temporal tests and router export
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Removed temporal NLP API must not remain exported.
          p = Path('lib/custom-gpt-router.js')
          s = p.read_text()
          s = s.replace("export { resolveTemporalIntent } from './intake-orchestrator/temporal.js';\n", '')
          p.write_text(s)

          # Agent architecture tests must exercise the new public contract directly.
          p = Path('test/agent-architecture.test.js')
          s = p.read_text()
          old = "function parse(question_type, entity, expression, extra={}) {\n  return {version:'semantic_parse.v1',question_type,entity,period:{expression},comparison:extra.comparison??null,scope:extra.scope??null,depth:extra.depth??null};\n}\n"
          new = "const CURRENT_MTD={date_from:'2026-09-01',date_to:'2026-09-11'};\nconst LAST_CLOSED_MONTH={date_from:'2026-08-01',date_to:'2026-08-31'};\nconst LAST_CLOSED_QUARTER={date_from:'2026-04-01',date_to:'2026-06-30'};\nconst LAST_TWO_CLOSED_MONTHS={date_from:'2026-07-01',date_to:'2026-08-31'};\nfunction parse(question_type, entity, period, extra={}) {\n  return {version:'semantic_parse.v1',question_type,entity,period,comparison:extra.comparison??null,scope:extra.scope??null,depth:extra.depth??null};\n}\n"
          if old not in s:
              raise SystemExit('agent-architecture parse helper not found')
          s = s.replace(old, new)
          for before, after in [
              ("'este mes'", 'CURRENT_MTD'),
              ("'mes pasado'", 'LAST_CLOSED_MONTH'),
              ("'último trimestre'", 'LAST_CLOSED_QUARTER'),
              ("'últimos 2 meses'", 'LAST_TWO_CLOSED_MONTHS'),
          ]:
              s = s.replace(before, after)
          p.write_text(s)

          # Incremental execution tests use the same explicit current-MTD authority.
          p = Path('test/agent-incremental-execution.test.js')
          s = p.read_text()
          old = "    period: { expression: 'este mes' },"
          new = "    period: { date_from: '2026-09-01', date_to: '2026-09-11' },"
          if old not in s:
              raise SystemExit('incremental semantic period fixture not found')
          p.write_text(s.replace(old, new))

          # Intake-orchestrator tests now inject already-materialized temporal intent.
          p = Path('test/intake-orchestrator.test.js')
          s = p.read_text()
          old = "const decide = (question) => orchestrateQuestion(question, options);"
          new = "const Q2_2026 = { date_from: '2026-04-01', date_to: '2026-06-30' };\nconst LAST3_CLOSED = { date_from: '2026-06-01', date_to: '2026-08-31' };\nconst CURRENT_MTD = { date_from: '2026-09-01', date_to: '2026-09-11' };\nconst JUN_AUG = { date_from: '2026-06-01', date_to: '2026-08-31' };\nconst decide = (question, period = null) => orchestrateQuestion(question, {\n  ...options, ...(period ? { period } : {}),\n});"
          if old not in s:
              raise SystemExit('intake decide helper not found')
          s = s.replace(old, new)
          replacements = {
              "decide('¿Cuánto creció el share de Foton el último trimestre?')": "decide('¿Cuánto creció el share de Foton el último trimestre?', Q2_2026)",
              "decide('¿Cuánto cambió el share de Foton en los últimos 3 meses?')": "decide('¿Cuánto cambió el share de Foton en los últimos 3 meses?', LAST3_CLOSED)",
              "decide('¿Mejoró la conversión CRM el último trimestre?')": "decide('¿Mejoró la conversión CRM el último trimestre?', Q2_2026)",
              "decide('¿Cómo está la gestión de leads?')": "decide('¿Cómo está la gestión de leads?', CURRENT_MTD)",
              "decide('¿Cómo vienen las ventas este mes?')": "decide('¿Cómo vienen las ventas este mes?', CURRENT_MTD)",
              "decide('¿Cómo evolucionaron las ventas entre junio y agosto?')": "decide('¿Cómo evolucionaron las ventas entre junio y agosto?', JUN_AUG)",
              "decide('¿Qué sucursal explica la caída de ventas entre junio y agosto?')": "decide('¿Qué sucursal explica la caída de ventas entre junio y agosto?', JUN_AUG)",
          }
          for before, after in replacements.items():
              s = s.replace(before, after)
          s = s.replace('decision.temporal.semantic_type', 'decision.temporal.type')
          s = s.replace("['LAST_N_CLOSED_CALENDAR_MONTHS', '2026-06-01', '2026-08-31']", "['LAST_N_CLOSED_MONTHS', '2026-06-01', '2026-08-31']")
          p.write_text(s)
          PY

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/custom-gpt-router.js test/agent-architecture.test.js test/agent-incremental-execution.test.js test/intake-orchestrator.test.js
            git commit -m "test: migrate temporal fixtures to explicit ranges"
            git push origin HEAD:refactor/temporal-boundary-cleanup
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run full test suite
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          echo "$status" > test-exit-code.txt
          exit 0

      - name: Upload exact test output
        uses: actions/upload-artifact@v4
        with:
          name: temporal-pr-test-output
          path: |
            test-output.txt
            test-exit-code.txt
