name: certify-temporal-pr

on:
  push:
    branches:
      - refactor/temporal-boundary-cleanup

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run full test suite
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          echo "$status" > test-exit-code.txt
          exit 0

      - name: Upload exact test output
        uses: actions/upload-artifact@v4
        with:
          name: temporal-pr-test-output
          path: |
            test-output.txt
            test-exit-code.txt
