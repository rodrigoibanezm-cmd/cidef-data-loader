name: One-time predictability day validation

on:
  push:
    paths:
      - '.github/workflows/validate-predictability-day-once.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run targeted tests
        run: node --test test/predictability-day.test.js test/daily-close-forecast-backtest.test.js
