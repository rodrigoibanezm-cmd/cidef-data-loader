name: Patch competitive signal backtest v0.2 ROMs

on:
  push:
    paths:
      - '.github/workflows/patch-competitive-signal-backtest-v02-roms.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebase latest main
        run: git pull --rebase origin main
      - name: Test competitive signal backtest
        run: node --test test/competitive-signal-backtest.test.js
      - name: Check changed syntax
        run: |
          node --check lib/competitive-signal-backtest/backtestInput.js
          node --check lib/competitive-signal-backtest/projectBacktestOutput.js
          node --check lib/competitive-signal-backtest/buildSignalBacktest.js
          node --check lib/motors/competitive-signal-backtest-v01.js
      - name: Patch ROM files
        run: node scripts/patch-competitive-signal-backtest-v02-roms.mjs
      - name: Validate schema JSON
        run: node -e "JSON.parse(require('fs').readFileSync('rom/schema.json','utf8'))"
      - name: Verify ROM contract
        run: |
          grep -q 'competitive_signal_backtest_v01' rom/schema.json
          grep -q 'pair_offset' rom/schema.json
          grep -q 'pair_limit' rom/schema.json
          grep -q 'Motor determinista v0.2 de backtest de señales' rom/motors.md
      - name: Commit ROM changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rom/schema.json rom/motors.md
          if ! git diff --cached --quiet; then
            git commit -m "Document paginated competitive signal backtest"
            git push
          fi
