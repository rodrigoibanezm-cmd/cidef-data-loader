name: Patch deterioration status ROMs

on:
  push:
    paths:
      - '.github/workflows/patch-deterioration-status-roms.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Patch ROM files
        run: node scripts/patch-deterioration-status-roms.mjs
      - name: Validate schema
        run: node -e "JSON.parse(require('fs').readFileSync('rom/schema.json','utf8'))"
      - name: Commit ROM changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rom/schema.json rom/motors.md
          if ! git diff --cached --quiet; then
            git commit -m "Document productive deterioration status motor"
            git pull --rebase origin main
            git push
          fi
