name: E2E price episode v0.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/e2e-price-episode-v01.yml'

permissions:
  contents: write

jobs:
  capture-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture dry-run response
        shell: bash
        run: |
          URL='https://cidef-data-loader.vercel.app/api/custom-gpt'
          HTTP=$(curl -sS -o /tmp/body.json -w '%{http_code}' -X POST "$URL" -H 'content-type: application/json' --data '{"action":"price_episode_canonicalizer_v01","input":{"dry_run":true}}' || true)
          printf '{"http_status":"%s","body":' "$HTTP" > e2e-price-episode-v01-result.json
          if jq -e . /tmp/body.json >/dev/null 2>&1; then
            cat /tmp/body.json >> e2e-price-episode-v01-result.json
          else
            jq -Rn --arg body "$(cat /tmp/body.json 2>/dev/null || true)" '$body' >> e2e-price-episode-v01-result.json
          fi
          printf '}\n' >> e2e-price-episode-v01-result.json
          cat e2e-price-episode-v01-result.json
      - name: Commit diagnostic response
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e-price-episode-v01-result.json
          git commit -m 'test: capture price episode dry-run response'
          git push origin HEAD:main
