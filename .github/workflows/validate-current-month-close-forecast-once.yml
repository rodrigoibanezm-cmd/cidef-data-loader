name: One-time current month close forecast validation

on:
  push:
    paths:
      - '.github/workflows/validate-current-month-close-forecast-once.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run targeted tests after shared-helper alignment
        run: node --test test/current-month-close-forecast.test.js test/daily-close-forecast.test.js test/predictability-day.test.js
