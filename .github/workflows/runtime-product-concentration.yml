name: Runtime product concentration

on:
  push:
    paths:
      - '.github/workflows/runtime-product-concentration.yml'

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Call deployed Custom GPT endpoint
        run: |
          set -euo pipefail
          body='{"action":"ventas_product_concentration_v01","input":{"start_month":"2026-01","end_month":"2026-07","pareto_threshold_pct":80}}'
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o response.json -w '%{http_code}' -X POST \
              -H 'content-type: application/json' \
              --data "$body" \
              https://cidef-data-loader.vercel.app/api/custom-gpt || true)
            if [ "$code" = "200" ] && jq -e '.engine == "ventas_product_concentration_v01"' response.json >/dev/null; then
              break
            fi
            if [ "$i" = "8" ]; then
              echo "HTTP=$code"
              cat response.json || true
              exit 1
            fi
            sleep 10
          done
          jq -e '.version == "0.1"' response.json >/dev/null
          jq -e '.inputs.pareto_threshold_pct == 80' response.json >/dev/null
          jq -e '.monthly | length == 7' response.json >/dev/null
          jq -e '.validation.ventas_context_ok == true' response.json >/dev/null
          jq -e '.validation.recognized_sales_reconcile == true' response.json >/dev/null
          jq -e '.validation.resolved_model_sales_reconcile == true' response.json >/dev/null
          jq -e '.validation.pareto_threshold_reached_or_empty == true' response.json >/dev/null
          jq '{engine,version,status,inputs,period,coverage,validation,warnings}' response.json
