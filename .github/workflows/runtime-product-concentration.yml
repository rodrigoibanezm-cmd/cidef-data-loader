name: Runtime product concentration

on:
  push:
    paths:
      - '.github/workflows/runtime-product-concentration.yml'

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect product source fields
        run: |
          set -euo pipefail
          call() {
            curl -sS -X POST -H 'content-type: application/json' --data "$1" \
              https://cidef-data-loader.vercel.app/api/custom-gpt
          }
          echo '=== ventas schema ==='
          call '{"action":"table_schema","input":{"tables":["ventas_raw"]}}' | jq '.result'
          echo '=== master model schema ==='
          call '{"action":"table_schema","input":{"tables":["modelos_master_v01","marcas_master_v01"]}}' | jq '.result'
