name: test dealer inventory aging v01
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node --test test/dealer-inventory-aging-v01.test.js
      - name: Refresh main before ROM patch
        run: git pull --rebase origin main
      - run: node scripts/patch-dealer-aging-rom.mjs
      - name: Commit ROM if changed
        run: |
          if ! git diff --quiet -- rom/schema.json rom/motors.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rom/schema.json rom/motors.md
            git commit -m "register dealer inventory aging in ROM"
            git push origin HEAD:main
          fi
