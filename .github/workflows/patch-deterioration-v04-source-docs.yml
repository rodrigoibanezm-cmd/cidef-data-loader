name: Patch deterioration v0.4 source docs

on:
  push:
    paths:
      - '.github/workflows/patch-deterioration-v04-source-docs.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch motor source list
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('rom/motors.md')
          text = path.read_text()
          start = text.index('### `org_sales_deterioration_backtest_v01`')
          end = text.index('### `org_sales_observation_semantics_audit_v01`', start)
          section = text[start:end]
          old = '''Fuentes:\n\n```text\nventas_raw\nsucursales_master\npersonas_master\n```'''
          new = '''Fuentes:\n\n```text\nventas_raw\nsucursales_master\npersonas_master\nnotas_venta_raw      # sólo grain=tienda, evidencia ACTIVE_ZERO\nsucursal_aliases     # sólo grain=tienda, identidad NV→sucursal\n```'''
          if old not in section:
              raise SystemExit('expected deterioration source block not found')
          section = section.replace(old, new, 1)
          text = text[:start] + section + text[end:]
          path.write_text(text)
          PY
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rom/motors.md
          git commit -m "Align deterioration v0.4 source documentation"
          git push
