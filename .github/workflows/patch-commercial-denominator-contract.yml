name: patch-commercial-denominator-contract

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-commercial-denominator-contract.mjs'
      - '.github/workflows/patch-commercial-denominator-contract.yml'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-commercial-denominator-contract.mjs
      - name: Commit patched ROM
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rom/schema.json rom/orchestrator.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs: govern commercial denominator semantics'
          git push origin HEAD:main
