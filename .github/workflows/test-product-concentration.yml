name: Test product concentration

on:
  push:
    paths:
      - '.github/workflows/test-product-concentration.yml'
      - 'lib/product-model-resolution/**'
      - 'lib/motors/ventas-product-model-resolution-v01.js'
      - 'lib/motors/ventas-product-concentration-v01.js'
      - 'lib/custom-gpt-router.js'
      - 'test/ventas-product-model-resolution.test.js'
      - 'test/ventas-product-concentration.test.js'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check lib/motors/ventas-product-model-resolution-v01.js
      - run: node --check lib/motors/ventas-product-concentration-v01.js
      - run: node --test test/ventas-product-model-resolution.test.js test/ventas-product-concentration.test.js
      - run: node --input-type=module -e "import('./lib/custom-gpt-router.js').then(m=>{for(const a of ['ventas_product_model_resolution_v01','ventas_product_concentration_v01']) if(!m.listCustomGptActions().includes(a)) process.exit(1)})"
