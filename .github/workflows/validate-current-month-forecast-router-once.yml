name: One-time current month forecast router integration

on:
  push:
    paths:
      - '.github/workflows/validate-current-month-forecast-router-once.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify router action
        run: node -e "import('./lib/custom-gpt-router.js').then(m=>{if(!m.listCustomGptActions().includes('current_month_close_forecast_v01'))process.exit(1)})"
      - name: Run focused tests
        run: node --test test/current-month-close-forecast.test.js test/daily-close-forecast.test.js test/predictability-day.test.js
