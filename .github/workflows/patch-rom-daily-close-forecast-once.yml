name: One-time daily close forecast ROM patch

on:
  push:
    paths:
      - '.github/workflows/patch-rom-daily-close-forecast-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python scripts/patch-rom-daily-close-forecast.py
      - name: Commit ROM
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rom/schema.json rom/motors.md
          git commit -m 'document daily close forecast backtest v0.1'
          git push origin HEAD:main
