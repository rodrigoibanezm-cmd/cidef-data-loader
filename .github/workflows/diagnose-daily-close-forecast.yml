name: Diagnose daily close forecast

on:
  push:
    paths:
      - '.github/workflows/diagnose-daily-close-forecast.yml'

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture test output
        run: |
          node --test test/daily-close-forecast.test.js > scripts/daily-close-forecast-test-output.txt 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/daily-close-forecast-test-output.txt
          git commit -m "Capture daily close forecast test output"
          git push
