name: One-time ROM daily organizational context

on:
  push:
    paths:
      - '.github/workflows/rom-daily-org-once.yml'

permissions:
  contents: write

jobs:
  update-rom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Insert capability documentation
        run: python scripts/patch-rom-daily-org.py
      - name: Commit ROM update
        shell: bash
        run: |
          if git diff --quiet -- rom/motors.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rom/motors.md
          git commit -m 'document daily organizational ventas context'
          git push origin HEAD:main
