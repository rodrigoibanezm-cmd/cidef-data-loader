name: One-time daily organizational context validation

on:
  push:
    paths:
      - '.github/workflows/rom-daily-org-once.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run targeted tests
        run: node --test test/ventas-daily-organizational-context.test.js test/ventas-organizational-context.test.js
