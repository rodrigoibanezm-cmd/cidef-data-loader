name: Patch product concentration ROM

on:
  push:
    paths:
      - '.github/workflows/patch-product-concentration-rom.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Normalize ROM text
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path='rom/schema.json';
          const schema=JSON.parse(fs.readFileSync(path,'utf8'));
          schema.info.description=schema.info.description.replace(
            'parameterized product sales concentration/Pareto trend, parameterized product sales concentration/Pareto trend,',
            'parameterized product sales concentration/Pareto trend,'
          );
          fs.writeFileSync(path,`${JSON.stringify(schema,null,2)}\n`);
          JSON.parse(fs.readFileSync(path,'utf8'));
          NODE
      - name: Commit normalization
        run: |
          git config user.name 'cidef-agent-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add rom/schema.json
          git diff --cached --quiet || git commit -m 'Normalize product resolution ROM text'
          git push origin HEAD:main
