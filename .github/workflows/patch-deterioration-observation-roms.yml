name: Patch deterioration observation ROMs

on:
  push:
    paths:
      - '.github/workflows/patch-deterioration-observation-roms.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test deterioration semantics
        run: node --test test/org-sales-deterioration-backtest.test.js test/org-deterioration-observation-semantics.test.js test/observation-semantics-audit.test.js test/org-unit-evidence.test.js test/org-backtest-output.test.js
      - name: Patch ROM files
        run: node scripts/patch-deterioration-observation-roms.mjs
      - name: Validate schema JSON
        run: node -e "JSON.parse(require('fs').readFileSync('rom/schema.json','utf8'))"
      - name: Commit ROM changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rom/schema.json rom/motors.md
          if ! git diff --cached --quiet; then
            git commit -m "Document deterioration sparse observation semantics"
            git push
          fi
