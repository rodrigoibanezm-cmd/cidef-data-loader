name: E2E price episode fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/e2e-price-episode-fix.yml'

# E2E rerun after post-audit SQL fix.
jobs:
  dry:
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.run.outputs.summary }}
    steps:
      - id: run
        shell: bash
        run: |
          set -euo pipefail
          URL='https://cidef-data-loader.vercel.app/api/custom-gpt'
          BODY=$(curl -sS -X POST "$URL" -H 'content-type: application/json' --data '{"action":"price_episode_canonicalizer_v01","input":{"dry_run":true}}')
          echo "$BODY"
          echo "$BODY" | jq -e '.ok == true and .result.dry_run == true and .result.price_versions.unresolved == 0 and .result.vin_assignment.ambiguous == 0' >/dev/null
          SUMMARY=$(echo "$BODY" | jq -r '"PV=\(.result.price_versions.total)/\(.result.price_versions.resolved)/\(.result.price_versions.excluded)/\(.result.price_versions.unresolved) SP=\(.result.state_points.total)/\(.result.state_points.clean)/\(.result.state_points.source_conflicts) EP=\(.result.episodes.total)/\(.result.episodes.clean)/\(.result.episodes.source_conflicts) VIN=\(.result.vin_assignment.eligible)/\(.result.vin_assignment.assigned)/\(.result.vin_assignment.unassigned)/\(.result.vin_assignment.ambiguous)"')
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"

  refresh:
    needs: dry
    name: "refresh ${{ needs.dry.outputs.summary }}"
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.run.outputs.summary }}
    steps:
      - id: run
        shell: bash
        run: |
          set -euo pipefail
          URL='https://cidef-data-loader.vercel.app/api/custom-gpt'
          BODY=$(curl -sS -X POST "$URL" -H 'content-type: application/json' --data '{"action":"price_episode_canonicalizer_v01","input":{"dry_run":false}}')
          echo "$BODY"
          echo "$BODY" | jq -e '.ok == true and .result.dry_run == false and (.result.audit.overlaps|tonumber) == 0 and (.result.audit.grain_duplicates|tonumber) == 0 and (.result.audit.bridge_duplicates|tonumber) == 0 and (.result.audit.mismatches|tonumber) == 0 and (.result.audit.reconciliation_failures|tonumber) == 0 and (.result.audit.conflict_vins|tonumber) == 0' >/dev/null
          SUMMARY=$(echo "$BODY" | jq -r '"EP=\(.result.audit.episodes_total)/\(.result.audit.episodes_clean)/\(.result.audit.source_conflicts) VIN=\(.result.audit.vin_assigned) O=\(.result.audit.overlaps) D=\(.result.audit.grain_duplicates)/\(.result.audit.bridge_duplicates) M=\(.result.audit.mismatches) R=\(.result.audit.reconciliation_failures) C=\(.result.audit.conflict_vins)"')
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"

  done:
    needs: [dry, refresh]
    name: "E2E ${{ needs.refresh.outputs.summary }}"
    runs-on: ubuntu-latest
    steps:
      - run: echo 'E2E complete'
