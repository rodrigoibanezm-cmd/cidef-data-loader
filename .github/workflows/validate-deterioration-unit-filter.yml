name: Validate deterioration unit filter

on:
  push:
    paths:
      - '.github/workflows/validate-deterioration-unit-filter.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --test test/org-deterioration-episode-evidence.test.js test/org-sales-deterioration-backtest.test.js test/org-deterioration-observation-semantics.test.js test/observation-semantics-audit.test.js test/org-backtest-output.test.js
