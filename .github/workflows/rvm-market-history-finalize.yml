name: Finalize RVM market history v0.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rvm-market-history-finalize.yml'
      - 'scripts/finalize-rvm-market-history-rom.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check new motor syntax
        run: |
          node --check lib/motors/rvm-market-history-v01.js
          node --check lib/rvm/periods.js
          node --check lib/rvm/marketHistoryInput.js
          node --check lib/rvm/marketHistoryQuery.js
          node --check lib/rvm/buildMarketHistory.js
      - name: Run affected tests
        run: node --test test/rvm-market-history.test.js test/competitive-context.test.js test/competitive-share-trajectory.test.js
      - name: Verify agent exposure
        run: node --input-type=module -e "import('./lib/custom-gpt-router.js').then(m=>{if(!m.listCustomGptActions().includes('rvm_market_history_v01')) process.exit(1)})"
      - name: Update ROM after tests pass
        run: python scripts/finalize-rvm-market-history-rom.py
      - name: Validate ROM
        run: |
          node -e "JSON.parse(require('fs').readFileSync('rom/schema.json','utf8')); console.log('ROM_SCHEMA_OK')"
          grep -q 'rvm_market_history_v01' rom/motors.md
      - name: Commit final ROM and remove temporary finalizer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/rvm-market-history-finalize.yml scripts/finalize-rvm-market-history-rom.py
          git add rom/schema.json rom/motors.md
          git commit -m 'Finalize rvm_market_history_v01 v0.1'
          git push origin main
