name: certify-temporal-boundary

on:
  push:
    branches:
      - refactor/temporal-boundary-cleanup

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Align OpenAPI explicit period requirement
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'rom/schema.json';
          const schema = JSON.parse(fs.readFileSync(path, 'utf8'));
          const required = schema?.components?.schemas?.SemanticParse?.required;
          if (!Array.isArray(required)) throw new Error('SemanticParse.required missing');
          if (!required.includes('period')) {
            const questionTypeIndex = required.indexOf('question_type');
            required.splice(questionTypeIndex >= 0 ? questionTypeIndex + 1 : required.length, 0, 'period');
            fs.writeFileSync(path, `${JSON.stringify(schema, null, 2)}\n`);
          }
          NODE
          if ! git diff --quiet -- rom/schema.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add rom/schema.json
            git commit -m 'fix(schema): require explicit semantic period'
            git push origin HEAD:refactor/temporal-boundary-cleanup
          fi

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run full test suite and certify baseline-only failures
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm test 2>&1 | tee test-output.txt
          test_status=${PIPESTATUS[0]}
          set -e

          test_count="$(grep '^# tests ' test-output.txt | tail -1 | awk '{print $3}')"
          pass_count="$(grep '^# pass ' test-output.txt | tail -1 | awk '{print $3}')"
          fail_count="$(grep '^# fail ' test-output.txt | tail -1 | awk '{print $3}')"
          echo "tests=$test_count pass=$pass_count fail=$fail_count exit=$test_status"

          if [ "$fail_count" != "18" ]; then
            echo "Expected exactly the 18 pre-existing baseline failures, got $fail_count"
            exit 1
          fi

          expected_failures=(
            'counts null VIN rows independently'
            'monthly payload reconciles exactly with recognized sales'
            'test/commercial-scope-public-contract.test.js'
            'crm_universe_v01 reconciles company grain and OWN_STORES membership'
            'longitudinal consumes analytical_events and does not reconstruct identity locally'
            'Origen/Suborigen are preserved and breakdowns do not duplicate leads'
            'current CRM metric predicates remain deterministic over the prepared universe'
            'median completion walk-forward produces compact company and pooled-store error rows'
            'forecasts current company and observed stores from prior closed completion only'
            'DAILY compatibility mode preserves certified daily and does not add summary'
            'acceptance: VENTAS, RVM and CRM outputs are structurally alignable without shared cutoff inference'
            'audit action is registered in router, schema and motors registry'
            'product generation action is registered in router and schema'
            'generation master tables are exposed through controlled table actions'
            'legacy explicit target_model_ids contract remains present and brand route is public in schema'
            'Total and Filtros aplicados rows are discarded'
            'shared adapter rejects a non-COMPANY universe'
            'OpenAPI exposes a closed explicit VIN_GAP input and keeps the Actions root object-compatible'
          )
          for name in "${expected_failures[@]}"; do
            if ! grep -F -- "- $name" test-output.txt >/dev/null; then
              echo "Missing expected baseline failure: $name"
              exit 1
            fi
          done

          unexpected="$(grep '^not ok ' test-output.txt | sed -E 's/^not ok [0-9]+ - //' | while IFS= read -r line; do
            matched=0
            for expected in "${expected_failures[@]}"; do
              if [ "$line" = "$expected" ]; then matched=1; break; fi
            done
            if [ "$matched" -eq 0 ]; then printf '%s\n' "$line"; fi
          done)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected regressions:'
            printf '%s\n' "$unexpected"
            exit 1
          fi

          echo 'Full suite matches baseline failure set exactly.'

      - name: Certify rejected temporal architecture is absent
        shell: bash
        run: |
          set -euo pipefail
          rm -f test-output.txt residual-report.txt
          touch residual-report.txt

          failed=0
          forbidden=(
            'resolveTemporalIntent'
            'TEMPORAL_AMBIGUOUS'
            'LAST_CLOSED_CALENDAR_QUARTER'
            'CURRENT_MONTH_TO_DATE'
            'semantic_type'
            'PERIOD_MAP'
          )
          for term in "${forbidden[@]}"; do
            matches="$(grep -R -n -F "$term" . --exclude-dir=.git --exclude-dir=.github --exclude-dir=node_modules --exclude=residual-report.txt || true)"
            if [ -n "$matches" ]; then
              printf 'FORBIDDEN: %s\n%s\n' "$term" "$matches" | tee -a residual-report.txt
              failed=1
            fi
          done

          expression_hits="$(grep -R -n -F 'period.expression' . --exclude-dir=.git --exclude-dir=.github --exclude-dir=node_modules --exclude=residual-report.txt || true)"
          expression_unexpected="$(printf '%s\n' "$expression_hits" | grep -v '^./test/temporal-boundary.test.js:' | sed '/^$/d' || true)"
          if [ -n "$expression_unexpected" ]; then
            printf 'UNEXPECTED period.expression:\n%s\n' "$expression_unexpected" | tee -a residual-report.txt
            failed=1
          fi

          runtime_language="$(grep -R -n -E 'último trimestre|ultimo trimestre|last quarter|este mes|this month|año pasado|ano pasado|last year' lib api 2>/dev/null || true)"
          if [ -n "$runtime_language" ]; then
            printf 'RUNTIME NATURAL-LANGUAGE TEMPORAL PARSING:\n%s\n' "$runtime_language" | tee -a residual-report.txt
            failed=1
          fi

          removed_path="$(grep -R -n -F 'intake-orchestrator/temporal.js' lib api test rom 2>/dev/null || true)"
          if [ -n "$removed_path" ]; then
            printf 'REMOVED PARSER PATH REFERENCE:\n%s\n' "$removed_path" | tee -a residual-report.txt
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo 'Temporal boundary scan passed.' | tee residual-report.txt

      - name: Upload temporal residual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporal-residual-report
          path: residual-report.txt
          if-no-files-found: ignore
